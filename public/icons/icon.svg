<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="doomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b07" />
      <stop offset="50%" stop-color="#0a1a0f" />
      <stop offset="100%" stop-color="#020503" />
    </linearGradient>

    <radialGradient id="greenGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="cloak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#doomBg)" />

  <!-- Green Aura Glow -->
  <circle cx="256" cy="230" r="200" fill="url(#greenGlow)" />

  <!-- Doctor Doom Hood Outer -->
  <path d="M 120 380 C 120 200, 160 110, 256 110 C 352 110, 392 200, 392 380 C 340 370, 290 365, 256 365 C 222 365, 172 370, 120 380 Z" fill="url(#cloak)" stroke="#10b981" stroke-width="4" />

  <!-- Hood Inner Shadow -->
  <path d="M 145 375 C 150 220, 180 135, 256 135 C 332 135, 362 220, 367 375 C 320 360, 280 355, 256 355 C 232 355, 192 360, 145 375 Z" fill="#03160e" />

  <!-- Metallic Doctor Doom Mask Face Plate -->
  <path d="M 180 200 L 332 200 L 340 280 L 310 340 L 256 360 L 202 340 L 172 280 Z" fill="url(#metal)" stroke="#0f172a" stroke-width="6" />

  <!-- Eye Sockets (Glowing Green) -->
  <polygon points="200,240 240,245 235,260 195,255" fill="#000000" />
  <polygon points="272,245 312,240 317,255 277,260" fill="#000000" />
  <ellipse cx="218" cy="250" rx="12" ry="4" fill="#34d399" />
  <ellipse cx="294" cy="250" rx="12" ry="4" fill="#34d399" />

  <!-- Mask Nose Bridge & Mouth Grille -->
  <path d="M 256 220 L 256 280 M 244 285 L 268 285 M 240 300 L 272 300 M 244 315 L 268 315 M 248 330 L 264 330" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />

  <!-- Rivets -->
  <circle cx="190" cy="215" r="4" fill="#64748b" />
  <circle cx="322" cy="215" r="4" fill="#64748b" />
  <circle cx="185" cy="300" r="4" fill="#64748b" />
  <circle cx="327" cy="300" r="4" fill="#64748b" />

  <!-- Avengers 'A' Logo Overlay in Gold/Green -->
  <g transform="translate(256, 420) scale(0.65)">
    <path d="M -30 35 L 0 -45 L 30 35 L 15 35 L 7 15 L -7 15 L -15 35 Z M -4 5 L 4 5 L 0 -15 Z" fill="#10b981" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="200 40" />
  </g>

  <!-- Title Text -->
  <text x="256" y="480" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="4">DOOMSDAY</text>
</svg>
